<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172033"><link rel="manifest" href="./manifest.json"><title>成績記録司令部</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{background:#172033;color:#fff;padding:16px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:12px;opacity:.8}main{max-width:900px;margin:auto;padding:14px 14px 85px}.card,.item{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #17203312}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.item{cursor:pointer}.muted{color:#687386;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button{border:0;border-radius:9px;padding:9px 12px;background:#253858;color:white;font-weight:700}button.secondary{background:#e7ebf2;color:#172033}button.danger{background:#b42318}button.small{font-size:12px;padding:7px 9px}input,textarea{width:100%;padding:9px;border:1px solid #cdd3df;border-radius:8px;font:inherit}label{display:block;font-size:12px;font-weight:700;margin:9px 0 4px}textarea{min-height:70px}.stat{font-size:20px;font-weight:800}.actions{display:flex;gap:6px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid #e4e7ed;text-align:left;vertical-align:top}canvas{width:100%;height:260px;border:1px solid #e0e4eb;border-radius:9px}dialog{border:0;border-radius:14px;width:min(560px,calc(100% - 24px));padding:0}dialog::backdrop{background:#0008}.modal{padding:16px}
</style></head><body><header><h1>📊 成績記録司令部</h1><p>問題集・模試の得点を科目別に管理</p></header><main id="app"></main>
<nav style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;display:flex;gap:8px;z-index:3"><button onclick="home()" style="flex:1">科目一覧</button><button onclick="backup()" style="flex:1">バックアップ</button><button onclick="settings()" style="flex:1">設定</button></nav>
<dialog id="dlg"><div class="modal" id="dlgBody"></div></dialog>
<script>
const DB="score-log-command",V=1, presets=["国語","数学I・A","数学II・B・C","数学III","英語","地理","歴史総合・日本史探究","歴史総合・世界史探究","化学基礎・化学","生物基礎・生物","情報"];let db,subjects=[],forms=[],records=[],curS,curF;
const uid=p=>p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),date=s=>s?s.replaceAll("-","/"):"";
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,V);r.onupgradeneeded=()=>{let d=r.result;["subjects","forms","records"].forEach(x=>{if(!d.objectStoreNames.contains(x))d.createObjectStore(x,{keyPath:"id"})})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function all(s){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(s,o){return new Promise((ok,no)=>{let r=db.transaction(s,"readwrite").objectStore(s).put(o);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function del(s,id){return new Promise((ok,no)=>{let r=db.transaction(s,"readwrite").objectStore(s).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
async function load(){subjects=await all("subjects");forms=await all("forms");records=await all("records")}
async function createSubject(name,order){let s={id:uid("s"),name,order};subjects.push(s);await put("subjects",s);for(let j=1;j<=5;j++){let f={id:uid("f"),subjectId:s.id,name:"記録"+j,maxScore:100,order:j};forms.push(f);await put("forms",f)}}
async function seed(){
  const counts={};
  for(const s of subjects) counts[s.name]=(counts[s.name]||0)+1;
  const hasDuplicateSubjects=Object.values(counts).some(n=>n>1);

  // 以前の増殖バグで作られた重複科目を、記録が0件のときだけ整理する。
  if(hasDuplicateSubjects && records.length===0){
    for(const f of forms) await del("forms",f.id);
    for(const s of subjects) await del("subjects",s.id);
    subjects=[];
    forms=[];
  }

  if(subjects.length===0){
    for(let i=0;i<presets.length;i++) await createSubject(presets[i],i);
    return;
  }

  // 既存データに情報がなければ、情報だけ追加する。
  if(!subjects.some(s=>s.name==="情報")){
    const order=subjects.reduce((m,s)=>Math.max(m,Number(s.order)||0),-1)+1;
    await createSubject("情報",order);
  }
}
function render(x){app.innerHTML=x}
function home(){curS=curF=null;render(`<div class="card"><h2>科目一覧</h2><p class="muted">11科目を初期配置。科目名は自由に変更できます。</p></div><div class="grid">${subjects.sort((a,b)=>a.order-b.order).map(s=>`<div class="item" onclick="subjectPage('${s.id}')"><b>${esc(s.name)}</b><div class="muted">${forms.filter(f=>f.subjectId===s.id).length}フォーム</div></div>`).join("")}</div><div class="card"><button onclick="editSubjects()">科目名を変更</button></div>`)}
function subjectPage(id){curS=subjects.find(s=>s.id===id);curF=null;let fs=forms.filter(f=>f.subjectId===id).sort((a,b)=>a.order-b.order);render(`<button class="secondary small" onclick="home()">← 科目一覧</button><div class="card"><div class="row between"><h2>${esc(curS.name)}</h2><button onclick="addForm()">＋フォーム追加</button></div>${fs.map(f=>`<div class="item"><div class="row between"><div onclick="formPage('${f.id}')"><b>${esc(f.name)}</b><div class="muted">${records.filter(r=>r.formId===f.id).length}/255件　満点 ${f.maxScore}</div></div><button class="secondary small" onclick="editForm('${f.id}')">設定</button></div></div>`).join("")}</div>`)}
function formPage(id){curF=forms.find(f=>f.id===id);curS=subjects.find(s=>s.id===curF.subjectId);let rs=records.filter(r=>r.formId===id).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.createdAt-b.createdAt),v=rs.map(r=>r.score),avg=v.length?v.reduce((a,b)=>a+b,0)/v.length:null,latest=rs.at(-1),prev=rs.at(-2);render(`<button class="secondary small" onclick="subjectPage('${curS.id}')">← ${esc(curS.name)}</button><div class="card"><div class="row between"><div><h2>${esc(curF.name)}</h2><span class="muted">${rs.length}/255件　現在の満点 ${curF.maxScore}</span></div><button onclick="addRecord()">＋記録</button></div></div><div class="grid">${stat("最高",v.length?Math.max(...v)+"点":"—")}${stat("最低",v.length?Math.min(...v)+"点":"—")}${stat("平均",avg===null?"—":avg.toFixed(1)+"点")}${stat("最新",latest?latest.score+"点":"—")}${stat("前回との差",latest&&prev?((latest.score-prev.score>0?"+":"")+ (latest.score-prev.score)+"点"):"—")}</div><div class="card"><div class="row between"><h3 id="chartTitle">得点率の推移</h3><button class="secondary small" onclick="toggleChart()" id="chartToggle">偏差値グラフに切替</button></div><canvas id="chart" width="850" height="300"></canvas><p class="muted" id="chartNote">縦軸：得点率</p></div><div class="card"><h3>記録一覧</h3>${rs.length?`<table><tr><th>日付</th><th>記録</th><th>得点</th><th>偏差値</th><th>メモ</th><th></th></tr>${rs.slice().reverse().map(r=>`<tr><td>${esc(date(r.date))}</td><td>${esc(r.title)}</td><td><b>${r.score}/${r.maxScoreAtEntry}</b></td><td>${r.deviation===""?"—":r.deviation}</td><td>${esc(r.memo)}</td><td><div class="actions"><button class="secondary small" onclick="editRecord('${r.id}')">編集</button><button class="danger small" onclick="deleteRecord('${r.id}')">削除</button></div></td></tr>`).join("")}</table>`:"<p class='muted'>まだ記録がありません。</p>"}</div>`);setTimeout(()=>draw(rs),0)}
function stat(a,b){return `<div class="card"><span class="muted">${a}</span><div class="stat">${b}</div></div>`}
let chartMode="score";function draw(rs){let c=document.getElementById("chart");if(!c)return;let x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);let data=chartMode==="deviation"?rs.filter(r=>r.deviation!==""&&r.deviation!=null&&!Number.isNaN(Number(r.deviation))):rs;if(!data.length){x.fillStyle="#687386";x.font="14px sans-serif";x.fillText(chartMode==="deviation"?"偏差値が入力された記録を追加するとグラフが表示されます。":"記録を追加するとグラフが表示されます。",30,50);updateChartUI();return}let p={l:50,r:20,t:20,b:40},W=w-p.l-p.r,H=h-p.t-p.b,vals=chartMode==="deviation"?data.map(r=>Math.max(0,Math.min(100,Number(r.deviation)))):data.map(r=>r.score/r.maxScoreAtEntry*100);x.strokeStyle="#ccd2dc";x.fillStyle="#687386";x.font="12px sans-serif";for(let i=0;i<=5;i++){let y=p.t+H*i/5;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText((100-i*20)+(chartMode==="deviation"?"":"%"),8,y+4)}x.strokeStyle="#253858";x.lineWidth=3;x.beginPath();data.forEach((r,i)=>{let xx=p.l+(data.length==1?W/2:W*i/(data.length-1)),yy=p.t+H*(100-vals[i])/100;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.fillStyle="#253858";data.forEach((r,i)=>{let xx=p.l+(data.length==1?W/2:W*i/(data.length-1)),yy=p.t+H*(100-vals[i])/100;x.beginPath();x.arc(xx,yy,4,0,7);x.fill()});x.fillStyle="#687386";x.fillText("古い → 新しい　　縦軸："+(chartMode==="deviation"?"偏差値 (0〜100)":"得点率"),p.l,h-12);updateChartUI()}function toggleChart(){chartMode=chartMode==="score"?"deviation":"score";draw(records.filter(r=>r.formId===curF.id).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.createdAt-b.createdAt))}function updateChartUI(){let t=document.getElementById("chartTitle"),b=document.getElementById("chartToggle"),n=document.getElementById("chartNote");if(!t||!b||!n)return;if(chartMode==="deviation"){t.textContent="偏差値の推移";b.textContent="得点グラフに切替";n.textContent="縦軸：偏差値（0〜100）／偏差値未入力の記録は対象外"}else{t.textContent="得点率の推移";b.textContent="偏差値グラフに切替";n.textContent="縦軸：得点率"}}
function dialog(s){dlgBody.innerHTML=s;dlg.showModal()}function closeDlg(){dlg.close()}
function addRecord(){if(records.filter(r=>r.formId===curF.id).length>=255)return alert("このフォームは255件に達しています。新しい記録は追加できません。");dialog(`<h2>記録を追加</h2><form onsubmit="saveRecord(event)"><label>タイトル / 名前<input name="title" required placeholder="第12回 模試"></label><label>日付<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>得点（0〜${curF.maxScore}点）<input name="score" type="number" min="0" max="${curF.maxScore}" required></label><label>偏差値（任意）<input name="deviation" type="number" step=".1" placeholder="60.2"></label><label>メモ<textarea name="memo"></textarea></label><div class="actions"><button>保存</button><button type="button" class="secondary" onclick="closeDlg()">キャンセル</button></div></form>`)}
async function saveRecord(e){e.preventDefault();let d=new FormData(e.target),r={id:uid("r"),formId:curF.id,title:d.get("title"),date:d.get("date"),score:Number(d.get("score")),maxScoreAtEntry:curF.maxScore,deviation:d.get("deviation"),memo:d.get("memo"),createdAt:Date.now()};await put("records",r);records.push(r);closeDlg();formPage(curF.id)}
function editRecord(id){let r=records.find(x=>x.id===id);dialog(`<h2>記録を編集</h2><form onsubmit="updateRecord(event,'${id}')"><label>タイトル<input name="title" required value="${esc(r.title)}"></label><label>日付<input name="date" type="date" value="${r.date}" required></label><label>得点（0〜${r.maxScoreAtEntry}点）<input name="score" type="number" min="0" max="${r.maxScoreAtEntry}" value="${r.score}" required></label><label>偏差値<input name="deviation" type="number" step=".1" value="${esc(r.deviation)}"></label><label>メモ<textarea name="memo">${esc(r.memo)}</textarea></label><div class="actions"><button>保存</button><button type="button" class="secondary" onclick="closeDlg()">キャンセル</button></div></form>`)}
async function updateRecord(e,id){e.preventDefault();let r=records.find(x=>x.id===id),d=new FormData(e.target);r.title=d.get("title");r.date=d.get("date");r.score=Number(d.get("score"));r.deviation=d.get("deviation");r.memo=d.get("memo");await put("records",r);closeDlg();formPage(curF.id)}
async function deleteRecord(id){if(!confirm("この記録を削除しますか？"))return;await del("records",id);records=records.filter(r=>r.id!==id);formPage(curF.id)}
function editForm(id){let f=forms.find(x=>x.id===id);dialog(`<h2>フォーム設定</h2><form onsubmit="saveForm(event,'${id}')"><label>フォーム名<input name="name" required value="${esc(f.name)}"></label><label>満点（1〜200）<input name="max" type="number" min="1" max="200" value="${f.maxScore}" required></label><p class="muted">満点変更後も過去の記録は登録時の満点を保持します。</p><div class="actions"><button>保存</button><button type="button" class="secondary" onclick="closeDlg()">キャンセル</button><button type="button" class="danger" onclick="removeForm('${id}')">フォーム削除</button></div></form>`)}
async function saveForm(e,id){e.preventDefault();let f=forms.find(x=>x.id===id),d=new FormData(e.target);f.name=d.get("name");f.maxScore=Number(d.get("max"));await put("forms",f);closeDlg();subjectPage(curS.id)}
async function removeForm(id){let f=forms.find(x=>x.id===id),n=records.filter(r=>r.formId===id).length;if(!confirm("「"+f.name+"」を削除しますか？"+(n?"\\n記録もすべて削除されます。":"")))return;for(let r of records.filter(r=>r.formId===id))await del("records",r.id);await del("forms",id);forms=forms.filter(x=>x.id!==id);records=records.filter(x=>x.formId!==id);closeDlg();subjectPage(curS.id)}
async function addForm(){let n=forms.filter(f=>f.subjectId===curS.id).length,f={id:uid("f"),subjectId:curS.id,name:"記録"+(n+1),maxScore:100,order:Date.now()};await put("forms",f);forms.push(f);subjectPage(curS.id)}
function editSubjects(){dialog(`<h2>科目名の変更</h2>${subjects.sort((a,b)=>a.order-b.order).map(s=>`<label>${s.order+1}番目<input id="s_${s.id}" value="${esc(s.name)}"></label>`).join("")}<div class="actions"><button onclick="saveSubjects()">保存</button><button class="secondary" onclick="closeDlg()">キャンセル</button></div>`)}
async function saveSubjects(){for(let s of subjects){let v=document.getElementById("s_"+s.id).value.trim();if(v){s.name=v;await put("subjects",s)}}closeDlg();home()}
function settings(){dialog(`<h2>設定・データ管理</h2><p class="muted">記録は端末内に保存されます。機種変更やブラウザデータ削除に備えて、定期的にバックアップしてください。</p><div class="actions"><button onclick="exportJSON()">JSONを書き出す</button><button class="secondary" onclick="importJSON()">JSONから復元</button><button class="secondary" onclick="closeDlg()">閉じる</button></div>`)}
function backup(){settings()}
function exportJSON(){let d={app:"成績記録司令部",version:1,exportedAt:new Date().toISOString(),subjects,forms,records},a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="成績記録司令部_backup_"+new Date().toISOString().slice(0,10)+".json";a.click()}
function importJSON(){let i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=async()=>{try{let d=JSON.parse(await i.files[0].text());if(!d.subjects||!d.forms||!d.records)throw 0;if(!confirm("現在のデータをバックアップで置き換えます。よろしいですか？"))return;for(let s of subjects)await del("subjects",s.id);for(let f of forms)await del("forms",f.id);for(let r of records)await del("records",r.id);for(let s of d.subjects)await put("subjects",s);for(let f of d.forms)await put("forms",f);for(let r of d.records)await put("records",r);await load();closeDlg();home();alert("復元しました！")}catch(e){alert("バックアップファイルを読み込めませんでした。")}};i.click()}
openDB().then(load).then(seed).then(load).then(home);if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
